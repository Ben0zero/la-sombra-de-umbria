<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Sombra de Umbría</title>
<style>
  :root{
    --bg:#0c0a13; --panel:#1b1628; --panel2:#221b34; --line:#3a3058;
    --gold:#e8b85c; --gold2:#c9912f; --text:#efe9fb; --muted:#a99fc6;
    --ok:#6ee7a8; --bad:#ff7b7b; --warn:#ffcf6b;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:var(--text);
    background:
      radial-gradient(1000px 600px at 50% -10%, #2a2140 0%, transparent 60%),
      radial-gradient(800px 500px at 90% 110%, #1d1830 0%, transparent 60%),
      var(--bg);
    min-height:100%;display:flex;justify-content:center;padding:18px;
  }
  .app{width:100%;max-width:940px;display:flex;flex-direction:column;gap:16px;}

  /* ---------- HUD ---------- */
  .hud{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:linear-gradient(180deg,#1e1830,#171226);border:1px solid var(--line);border-radius:16px;padding:12px 16px;box-shadow:0 10px 30px rgba(0,0,0,.45);}
  .brand{display:flex;align-items:center;gap:9px;font-family:Georgia,'Times New Roman',serif;}
  .brand-icon{font-size:24px;filter:drop-shadow(0 0 8px rgba(232,184,92,.6));}
  .brand-name{font-size:19px;font-weight:700;letter-spacing:.5px;background:linear-gradient(180deg,#ffe6ab,#d99b2f);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap;}
  .hud-stats{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-left:auto;}
  .statbox{display:flex;align-items:center;gap:6px;background:#120f1e;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:14px;font-weight:600;}
  .statbox.hp{flex-direction:column;align-items:stretch;gap:5px;min-width:104px;}
  .statbox.lvl{flex-direction:column;align-items:stretch;gap:5px;min-width:96px;}
  .statbox.dice.low{border-color:var(--bad);box-shadow:0 0 0 1px rgba(255,123,123,.3);}
  .hp-top{display:flex;align-items:center;gap:6px;}
  .hpbar{height:6px;border-radius:6px;background:#2a2340;overflow:hidden;}
  .hpbar i{display:block;height:100%;width:100%;border-radius:6px;background:linear-gradient(90deg,#ff5c72,#ff9a5c);transition:width .4s ease;}
  .hpbar.xp i{background:linear-gradient(90deg,#8b5cf6,#e8b85c);}
  .profchip{display:flex;align-items:center;gap:6px;background:#120f1e;border:1px solid var(--gold2);border-radius:10px;padding:6px 10px;font-size:13.5px;font-weight:700;color:var(--gold);}
  .chips{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{background:#120f1e;border:1px solid var(--line);border-radius:999px;padding:5px 9px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:5px;}
  .chip b{color:var(--gold);}
  .chip small{color:var(--muted);font-weight:600;}
  .btn{font:inherit;font-weight:700;cursor:pointer;border:none;border-radius:11px;padding:11px 18px;color:#2a1b06;background:linear-gradient(180deg,#ffd98a,#d99b2f);box-shadow:0 6px 16px rgba(217,155,47,.35);transition:transform .12s ease, filter .12s ease;}
  .btn:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.06);}
  .btn:active:not(:disabled){transform:translateY(0);}
  .btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;}
  .btn.ghost{color:var(--muted);background:transparent;border:1px solid var(--line);box-shadow:none;font-weight:600;font-size:13px;padding:9px 13px;}
  .btn.ghost:hover:not(:disabled){color:var(--text);border-color:var(--gold2);}

  /* ---------- Escena ---------- */
  .stage{flex:1;}
  .panel{position:relative;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:20px;padding:26px 28px 24px;min-height:300px;box-shadow:0 18px 50px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.04);overflow:hidden;}
  .panel::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(600px 220px at 20% 0%, rgba(232,184,92,.10), transparent 70%);}
  .art{font-size:52px;line-height:1;margin-bottom:6px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.6));}
  .panel h2{font-family:Georgia,'Times New Roman',serif;margin:0 0 12px;font-size:26px;letter-spacing:.4px;color:#ffe9bd;}
  .panel p#text{margin:0;font-size:16.5px;line-height:1.65;color:#ded6f0;white-space:pre-line;}
  .hint{display:inline-flex;align-items:center;gap:8px;margin-top:16px;background:#120f1e;border:1px dashed var(--gold2);border-radius:10px;padding:8px 13px;font-size:13.5px;color:var(--warn);}
  .fade-in{animation:fadeUp .38s ease both;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

  /* ---------- Barra de enemigo / jefe ---------- */
  .foebar{margin-top:16px;background:#180f18;border:1px solid #5a2a3a;border-radius:12px;padding:11px 14px;}
  .foename{font-weight:700;color:#ffb3c1;font-size:15px;margin-bottom:7px;}
  .foehp{height:12px;border-radius:8px;background:#2a1620;overflow:hidden;}
  .foehp i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#ff4d6d,#a4133c);transition:width .45s ease;}
  .foehptext{font-size:12px;color:var(--muted);margin-top:6px;text-align:right;}

  /* ---------- Creación ---------- */
  .creation-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px;}
  .statrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#120f1e;border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
  .statrow .sname{font-weight:700;min-width:104px;font-size:14.5px;}
  .statrow .sdice{display:flex;gap:5px;flex:1;}
  .mini{width:25px;height:25px;border-radius:6px;display:grid;place-items:center;font-size:12.5px;font-weight:700;background:#241d38;border:1px solid var(--line);}
  .mini.drop{opacity:.32;text-decoration:line-through;}
  .statrow .sscore{font-size:23px;font-weight:800;color:#ffe0a3;min-width:36px;text-align:right;font-variant-numeric:tabular-nums;}
  .statrow .smod{font-size:13px;font-weight:800;color:var(--ok);min-width:40px;text-align:right;}
  .statrow .scards{font-size:12px;font-weight:700;color:var(--muted);background:#1a1529;border:1px solid var(--line);border-radius:999px;padding:3px 9px;}
  .statrow .scards.has{color:var(--gold);border-color:var(--gold2);}
  .creation-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px;align-items:center;}
  .creation-sum{color:var(--muted);font-size:13.5px;font-weight:600;margin-left:auto;}
  .crea-sec{margin-top:20px;font-family:Georgia,serif;color:#ffe9bd;font-size:18px;}
  .crea-note{color:var(--muted);font-size:13px;margin-top:4px;}
  .profgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px;margin-top:12px;}
  .prof{text-align:left;cursor:pointer;font:inherit;color:var(--text);background:linear-gradient(180deg,#241d38,#1b1529);border:1px solid var(--line);border-radius:14px;padding:14px;transition:.15s ease;}
  .prof:hover{border-color:var(--gold);transform:translateY(-3px);}
  .prof.selected{border-color:var(--gold);box-shadow:0 0 0 2px rgba(232,184,92,.35),0 10px 22px rgba(232,184,92,.18);}
  .prof .picon{font-size:30px;line-height:1;}
  .prof .pname{font-weight:800;font-size:16px;margin-top:7px;}
  .prof .pstat{font-size:12.5px;color:#cdc2ea;font-weight:700;margin-top:3px;}
  .prof .ptag{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.35;}
  .prof .pcount{font-size:11.5px;font-weight:800;color:var(--gold);margin-top:8px;}

  /* ---------- Resultado ---------- */
  #result{margin-top:18px;}
  .dice-box{display:flex;align-items:center;gap:16px;background:#100d1b;border:1px solid var(--line);border-radius:14px;padding:16px 18px;}
  .die{width:74px;height:74px;flex:0 0 auto;border-radius:16px;display:grid;place-items:center;font-size:32px;font-weight:800;font-family:Georgia,serif;background:linear-gradient(160deg,#2c2444,#1a1429);border:2px solid var(--gold2);color:#ffe0a3;box-shadow:0 0 22px rgba(232,184,92,.25);}
  .die.settle{animation:pop .35s ease;}
  @keyframes pop{0%{transform:scale(1.25);}60%{transform:scale(.95);}100%{transform:scale(1);}}
  .math{font-size:14.5px;color:var(--muted);line-height:1.7;}
  .math b{color:var(--text);}
  .math .plus{color:var(--gold);}
  .verdict{font-size:17px;font-weight:800;letter-spacing:.5px;margin-top:4px;}
  .verdict.ok{color:var(--ok);}
  .verdict.bad{color:var(--bad);}
  .rtext{margin-top:14px;padding:15px 17px;border-radius:13px;font-size:16px;line-height:1.6;border-left:4px solid var(--line);background:#171226;white-space:pre-line;}
  .rtext.ok{border-left-color:var(--ok);}
  .rtext.bad{border-left-color:var(--bad);}

  .options{display:flex;flex-direction:column;gap:11px;margin-top:18px;}
  .opt{text-align:left;font:inherit;cursor:pointer;color:var(--text);background:linear-gradient(180deg,#241d38,#1b1529);border:1px solid var(--line);border-radius:13px;padding:15px 17px;transition:.15s ease;}
  .opt:hover:not(:disabled){border-color:var(--gold);transform:translateX(4px);box-shadow:-4px 0 0 var(--gold2);}
  .opt:disabled{opacity:.45;cursor:not-allowed;}
  .opt .olabel{font-weight:700;font-size:16px;}
  .opt .odesc{color:var(--muted);font-size:13.5px;margin-top:3px;}
  .opt .ocost{float:right;font-weight:800;color:var(--gold);}
  .opt.danger{border-color:rgba(255,123,123,.45);background:linear-gradient(180deg,#2a1a22,#1e1319);}
  .opt.danger:hover:not(:disabled){border-color:var(--bad);box-shadow:-4px 0 0 var(--bad);}
  .opt.danger .olabel{color:var(--bad);}
  .opt.shop{border-color:rgba(232,184,92,.4);}

  /* ---------- Mano / Cartas ---------- */
  .hand-wrap{position:relative;background:linear-gradient(180deg,#171226,#120e1e);border:1px solid var(--line);border-radius:16px;padding:14px 16px 12px;}
  .grimoire-btn{position:absolute;top:11px;right:13px;z-index:2;}
  .hand{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
  .hand.empty{color:var(--muted);font-size:14px;padding:22px 0;justify-content:center;text-align:center;}
  .card{width:158px;position:relative;overflow:hidden;cursor:pointer;text-align:left;background:linear-gradient(165deg,#2a2340,#181327);border:1px solid #453a63;border-radius:14px;padding:13px 13px 12px;color:var(--text);font:inherit;transition:.18s ease;}
  .card::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:.2s;background:radial-gradient(120px 80px at 80% 0%, rgba(232,184,92,.18), transparent 70%);}
  .card:hover:not(.disabled){transform:translateY(-7px);border-color:var(--gold);box-shadow:0 14px 26px rgba(232,184,92,.22);}
  .card:hover:not(.disabled)::after{opacity:1;}
  .card .cicon{font-size:30px;line-height:1;}
  .card .cname{font-weight:700;font-size:14.5px;margin-top:8px;line-height:1.25;}
  .card .cdesc{color:var(--muted);font-size:12px;margin-top:5px;line-height:1.35;min-height:31px;}
  .card .cfoot{display:flex;align-items:center;gap:7px;margin-top:9px;flex-wrap:wrap;}
  .card .ctag{font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 8px;background:#120f1e;border:1px solid var(--line);color:#cdc2ea;}
  .card .cbonus{position:absolute;top:10px;right:10px;font-size:12px;font-weight:800;color:#2a1b06;background:linear-gradient(180deg,#ffd98a,#d99b2f);border-radius:999px;padding:3px 9px;box-shadow:0 3px 8px rgba(0,0,0,.4);}
  .card.master{border-color:#7a5cc4;box-shadow:0 0 0 1px rgba(122,92,196,.5);}
  .card.master .cbonus{background:linear-gradient(180deg,#c9a6ff,#8b5cf6);color:#1a0f2e;}
  .card.matched{border-color:var(--gold);box-shadow:0 0 0 2px rgba(232,184,92,.35), 0 10px 22px rgba(232,184,92,.2);}
  .card.disabled{opacity:.42;cursor:not-allowed;transform:none!important;box-shadow:none!important;}
  .card.selected{border-color:var(--gold);transform:translateY(-7px);box-shadow:0 0 0 2px rgba(232,184,92,.55), 0 16px 30px rgba(232,184,92,.3);}
  .card.selected::after{opacity:1;}
  .roll-row{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:14px;}
  .roll-row[hidden]{display:none;}
  .btn.roll{font-size:16px;font-weight:800;padding:14px 24px;border-radius:14px;letter-spacing:.3px;
    background:linear-gradient(180deg,#ffd98a,#d99b2f);color:#2a1b06;border:none;
    box-shadow:0 10px 24px rgba(217,155,47,.4);}
  .btn.roll:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 14px 28px rgba(217,155,47,.5);}
  .btn.roll:disabled{opacity:.45;box-shadow:none;cursor:not-allowed;}
  .btn.nodie{font-size:15.5px;font-weight:800;padding:14px 22px;border-radius:14px;letter-spacing:.3px;
    background:linear-gradient(180deg,#3a3355,#241f3a);color:#e7e0ff;border:1px solid #5a4d86;
    box-shadow:0 8px 20px rgba(0,0,0,.35);}
  .btn.nodie:hover:not(:disabled){transform:translateY(-2px);border-color:var(--gold);}
  .btn.nodie:disabled{opacity:.45;box-shadow:none;cursor:not-allowed;}
  .die.low{font-size:30px;border-color:#5a4d86;color:#cdc2ea;background:linear-gradient(160deg,#241f3a,#161125);box-shadow:none;}
  .nodice{color:#cdc2ea;font-weight:800;}
  .deckinfo{text-align:center;color:var(--muted);font-size:12px;margin-top:10px;letter-spacing:.3px;line-height:1.7;}
  .deckinfo .locked{color:#8f86b5;}
  .deckinfo .locked b{color:#b9a6e6;font-weight:700;}

  /* ---------- Grimorio (modal) ---------- */
  .modal{position:fixed;inset:0;background:rgba(6,4,12,.8);display:grid;place-items:center;z-index:200;padding:18px;animation:fadeUp .22s ease both;}
  .modal[hidden]{display:none;}
  .modal-box{width:100%;max-width:800px;max-height:88vh;overflow:auto;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:20px 22px;box-shadow:0 24px 60px rgba(0,0,0,.65);}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:10px;}
  .modal-head h3{margin:0;font-family:Georgia,serif;color:#ffe9bd;font-size:22px;}
  .modal-sub{color:var(--muted);font-size:13.5px;margin-bottom:14px;}
  .grim-sec{margin:16px 0 10px;font-family:Georgia,serif;color:#ffe9bd;font-size:17px;border-bottom:1px solid var(--line);padding-bottom:6px;}
  .grim-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
  .gcard{background:#120f1e;border:1px solid var(--line);border-radius:12px;padding:12px;position:relative;}
  .gcard.locked{opacity:.5;}
  .gcard.master{border-color:#7a5cc4;box-shadow:0 0 0 1px rgba(122,92,196,.4);}
  .gcard .gicon{font-size:26px;}
  .gcard .gname{font-weight:700;font-size:14px;margin-top:6px;}
  .gcard .gtier{font-size:10.5px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.6px;margin-top:3px;}
  .gcard .gmeta{font-size:12.5px;color:#cdc2ea;margin-top:8px;font-weight:600;}
  .gcard .gdesc{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.35;min-height:32px;}
  .gcard .greq{font-size:11.5px;font-weight:800;margin-top:8px;color:var(--bad);}
  .gcard .greq.ok{color:var(--ok);}

  /* ---------- Tirada a pantalla completa ---------- */
  .dice-overlay{position:fixed;inset:0;z-index:300;display:grid;place-items:center;background:rgba(5,3,10,.74);backdrop-filter:blur(3px);transition:opacity .25s ease;animation:fadeUp .2s ease both;}
  .dice-overlay[hidden]{display:none;}
  .dice-overlay.closing{opacity:0;}
  .dice-stage{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:20px;}
  .bigdie{width:150px;height:150px;border-radius:26px;display:grid;place-items:center;font-size:64px;font-weight:800;font-family:Georgia,serif;color:#ffe0a3;background:linear-gradient(160deg,#2c2444,#1a1429);border:3px solid var(--gold2);box-shadow:0 0 40px rgba(232,184,92,.35);}
  .bigdie.rolling{animation:shake .1s linear infinite;}
  .bigdie.settle{animation:pop .4s ease;}
  .bigdie.ok{border-color:var(--ok);color:#bff5d5;box-shadow:0 0 46px rgba(110,231,168,.5);}
  .bigdie.bad{border-color:var(--bad);color:#ffc9c9;box-shadow:0 0 46px rgba(255,123,123,.45);}
  .bigdie.crit{border-color:#ffd98a;color:#fff4cf;box-shadow:0 0 64px rgba(255,217,138,.85);}
  .bigdie.fumble{border-color:#8a5cff;color:#e0d0ff;box-shadow:0 0 46px rgba(138,92,255,.5);}
  .dice-label{font-size:16px;font-weight:700;color:#ded6f0;}
  .dice-need{font-size:14px;color:var(--muted);}
  .dice-verdict{font-size:27px;font-weight:900;letter-spacing:1px;min-height:34px;}
  .dice-verdict.ok{color:var(--ok);}
  .dice-verdict.bad{color:var(--bad);}
  .dice-verdict.crit{color:#ffd98a;}
  .dice-verdict.fumble{color:#b18cff;}

  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#241d38;border:1px solid var(--gold2);color:var(--text);padding:11px 18px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,.5);z-index:400;animation:fadeUp .3s ease both;max-width:92vw;text-align:center;}
  @media(max-width:640px){
    .brand-name{font-size:16px;}
    .panel{padding:20px;}
    .panel h2{font-size:22px;}
    .card{width:calc(50% - 6px);}
    .creation-grid{grid-template-columns:1fr;}
    .bigdie{width:118px;height:118px;font-size:50px;}
  }
</style>
</head>
<body>
<div class="app">

  <header class="hud">
    <div class="brand">
      <span class="brand-icon">⚔️</span>
      <span class="brand-name">La Sombra de Umbría</span>
    </div>
    <div class="hud-stats">
      <div class="statbox hp">
        <div class="hp-top">❤️ <span id="hp">12</span><small style="color:var(--muted)">/<span id="hpmax">12</span></small></div>
        <div class="hpbar"><i id="hpfill"></i></div>
      </div>
      <div class="statbox lvl">
        <div class="hp-top">⭐ Nv <span id="lvl">1</span></div>
        <div class="hpbar xp"><i id="xpfill"></i></div>
      </div>
      <div class="statbox dice" id="dicebox">🎲 <span id="dice">11</span></div>
      <div class="statbox">🪙 <span id="gold">0</span></div>
      <div class="profchip" id="profchip" hidden></div>
      <div class="chips" id="stat-chips"></div>
    </div>
    <button class="btn ghost" id="music">🔊 Música</button>
    <button class="btn ghost" id="sfx">🔔 Sonido</button>
    <button class="btn ghost" id="reset">🆕 Nueva</button>
  </header>

  <main class="stage">
    <section class="panel" id="panel">
      <div class="art" id="art">🏰</div>
      <h2 id="title"></h2>
      <p id="text"></p>
      <div id="hint"></div>
      <div id="enemybar"></div>
      <div id="creation"></div>
      <div id="result"></div>
      <div class="options" id="options"></div>
    </section>
  </main>

  <footer class="hand-wrap">
    <button class="btn ghost grimoire-btn" id="grimoire">📖 Grimorio</button>
    <div class="hand" id="hand"></div>
    <div class="roll-row" id="roll-row" hidden>
      <button class="btn roll" id="rolldie" disabled>🎲 Tirar el dado</button>
      <button class="btn nodie" id="rollnodie" disabled>✋ Sin dado</button>
    </div>
    <div class="deckinfo" id="deckinfo"></div>
  </footer>

</div>

<div class="dice-overlay" id="dice-overlay" hidden>
  <div class="dice-stage">
    <div class="dice-label" id="dice-label">Tirada</div>
    <div class="bigdie" id="bigdie">?</div>
    <div class="dice-need" id="dice-need"></div>
    <div class="dice-verdict" id="dice-verdict"></div>
  </div>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <h3>📖 Grimorio</h3>
      <button class="btn ghost" id="modal-close">✕ Cerrar</button>
    </div>
    <div class="modal-sub" id="modal-sub"></div>
    <div id="grim-body"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* =======================================================
     NÚCLEO DE AUDIO COMPARTIDO
  ======================================================= */
  var AudioEngine = (function(){
    var ctx=null, master=null;
    function init(){
      if(ctx) return ctx;
      var AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      ctx = new AC();
      master = ctx.createGain(); master.gain.value=1; master.connect(ctx.destination);
      return ctx;
    }

  /* =======================================================
     ESTADO + GUARDADO
  ======================================================= */
  var state = null, uid = 0, lastScene = null;

  function $(id){ return document.getElementById(id); }
  function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  function mod(score){ return Math.floor((score-10)/2); }
  function fmtMod(m){ return (m>=0?'+':'') + m; }
  function levelFor(xp){ var l=1; for(var i=2;i<LEVEL_XP.length;i++){ if(xp>=LEVEL_XP[i]) l=i; } return l; }
  function prof(){ return state.profession ? PROFESSIONS[state.profession] : null; }

  function allCards(){
    var p = prof();
    var list = p ? p.cards.slice() : [];
    return list.concat(NEUTRAL);
  }
  function isUnlocked(c){
    if(c.reqLevel != null) return state.level >= c.reqLevel;
    return state.scores[c.stat] >= c.req;
  }
  function cardInPlay(id){
    return state.hand.some(function(c){return c.id===id;}) ||
           state.discard.some(function(c){return c.id===id;}) ||
           state.deck.some(function(c){return c.id===id;});
  }
  function sceneBest(s){ return s.bestProfession ? (prof() ? prof().stat : 'fuerza') : s.best; }

  function freshState(){
    return {
      hp:HP_START, maxHp:HP_START, gold:0, dice:DICE_START,
      scores:{fuerza:0, destreza:0, intelecto:0, carisma:0},
      rolled:false, rollDice:null, profession:null, level:1, xp:0,
      deck:[], discard:[], hand:[],
      scene:'start', progress:0, flags:{},
      result:null, options:[], busy:false, selected:null
    };
  }

  function save(){
    try{
      localStorage.setItem(SAVE_KEY, JSON.stringify({
        v:2, hp:state.hp, maxHp:state.maxHp, gold:state.gold, dice:state.dice,
        scores:state.scores, rolled:state.rolled, rollDice:state.rollDice,
        profession:state.profession, level:state.level, xp:state.xp,
        deck:state.deck, discard:state.discard, hand:state.hand,
        scene:state.scene, progress:state.progress, flags:state.flags,
        result:state.result, options:state.options
      }));
    }catch(e){}
  }
  function loadSave(){
    try{
      var raw = localStorage.getItem(SAVE_KEY); if(!raw) return null;
      var d = JSON.parse(raw); if(!d || d.v!==2) return null; return d;
    }catch(e){ return null; }
  }
  function clearSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }

  function newGame(){
    uid = 0; lastScene = null;
    clearSave();
    state = freshState();
    render();
  }

  function initDeck(){
    var unlocked = allCards().filter(isUnlocked);
    if(unlocked.length === 0) unlocked = (prof()?prof().cards.filter(function(c){return c.reqLevel===1;}):[]);
    state.deck = shuffle(unlocked.map(function(c){ return Object.assign({}, c); }));
    state.discard = []; state.hand = [];
    refillHand();
  }
  function drawCard(){
    if(state.deck.length===0){ if(state.discard.length===0) return null; state.deck=shuffle(state.discard); state.discard=[]; }
    var card = Object.assign({}, state.deck.pop(), {uid: ++uid});
    state.hand.push(card); return card;
  }
  function refillHand(){ while(state.hand.length < HAND_SIZE){ if(!drawCard()) break; } }
  function currentScene(){ return SCENES[state.scene]; }
  function canPlay(){
    var s = currentScene();
    if(state.busy || state.result || state.options.length) return false;
    if(s.type) return false;
    return true;
  }

  /* =======================================================
     DADOS
  ======================================================= */
  function computeRoll(card, mode){
    var s = currentScene();
    var best = sceneBest(s);
    var statBonus = mod(state.scores[card.stat] || 0);
    var matched = card.stat === best;
    var matchBonus = matched ? 2 : 0;
    var spending = (mode === 'roll');               // gasta 1 dado -> d20 (o el dado del jefe)
    var faces = spending ? (s.bossDie || 20) : 6;   // a pulso -> d6 improvisado, gratis
    var die = 1 + Math.floor(Math.random()*faces);
    var dc = s.dc || 10;
    (s.dcMods || []).forEach(function(m){ if(state.flags[m.flag]) dc += m.delta; });
    var crit = (faces === 20 && die === 20);
    var fumble = (faces === 20 && die === 1);
    var total = die + statBonus + card.bonus + matchBonus;
    return {die:die, faces:faces, spending:spending, statBonus:statBonus, cardBonus:card.bonus,
            matchBonus:matchBonus, matched:matched, total:total, dc:dc,
            success:(crit || (!fumble && total >= dc)), crit:crit, fumble:fumble, stat:card.stat};
  }

  // Tirada a pantalla completa (overlay grande)
  function animateDie(roll){
    return new Promise(function(resolve){
      var ov=$('dice-overlay'), die=$('bigdie'), label=$('dice-label'), need=$('dice-need'), verdict=$('dice-verdict');
      die.className='bigdie rolling'; die.textContent='?';
      verdict.textContent=''; verdict.className='dice-verdict';
      label.textContent = STATS[roll.stat].icon + (roll.spending ? ' Tirada de ' : ' A pulso · d6 de ') + STATS[roll.stat].name;
      need.textContent = 'Necesitas ' + roll.dc + ' o más';
      ov.hidden = false;
      var ticks=0, faces = roll.faces || 20;
      var iv=setInterval(function(){
        die.textContent = 1 + Math.floor(Math.random()*faces);
        if(++ticks > 12){
          clearInterval(iv);
          die.textContent = roll.die;
          die.className = 'bigdie settle';
          var cls = roll.crit?'crit':(roll.fumble?'fumble':(roll.success?'ok':'bad'));
          die.classList.add(cls);
          verdict.textContent = roll.crit?'¡CRÍTICO! 🎉':roll.fumble?'¡PIFIA! 💀':(roll.success?'¡ÉXITO!':'FALLO');
          verdict.classList.add(cls);
          setTimeout(function(){
            ov.classList.add('closing');
            setTimeout(function(){ ov.hidden = true; ov.classList.remove('closing'); resolve(); }, 250);
          }, 650);
        }
      }, 60);
    });
  }

  /* =======================================================
     CREACIÓN
  ======================================================= */
  function rollOne(){
    var dice=[0,0,0,0].map(function(){ return 1+Math.floor(Math.random()*6); });
    dice.sort(function(a,b){ return b-a; });
    return {dice:dice, total:dice[0]+dice[1]+dice[2]};
  }
  // cuántas cartas neutrales desbloquea una característica
  function neutralUnlocked(k){ return NEUTRAL.filter(function(c){ return c.stat===k && state.scores[k] >= c.req; }).length; }

  function doRoll(){
    var results={}; STAT_KEYS.forEach(function(k){ results[k]=rollOne(); });
    var box=$('creation'), t=0;
    var iv=setInterval(function(){
      if(box){
        box.querySelectorAll('.sscore').forEach(function(el){ el.textContent=String(3+Math.floor(Math.random()*16)); });
        box.querySelectorAll('.smod').forEach(function(el){ el.textContent=fmtMod(Math.floor(Math.random()*9)-4); });
        box.querySelectorAll('.scards').forEach(function(el){ el.textContent='🃏 '+Math.floor(Math.random()*3); });
      }
      if(++t>9){
        clearInterval(iv);
        state.rollDice=results;
        STAT_KEYS.forEach(function(k){ state.scores[k]=results[k].total; });
        state.rolled=true; render();
      }
    },55);
  }

  function renderCreation(){
    var rows = STAT_KEYS.map(function(k){
      var shown = state.rolled ? state.scores[k] : null;
      var m = (shown!=null) ? fmtMod(mod(shown)) : '—';
      var n = state.rolled ? neutralUnlocked(k) : null;
      var dice='';
      if(state.rollDice && state.rollDice[k]){
        dice = state.rollDice[k].dice.map(function(d,i){ return '<span class="mini'+(i===3?' drop':'')+'">'+d+'</span>'; }).join('');
      }
      return '<div class="statrow">'+
        '<div class="sname">'+STATS[k].icon+' '+STATS[k].name+'</div>'+
        '<div class="sdice">'+dice+'</div>'+
        '<div class="sscore">'+(shown!=null?shown:'—')+'</div>'+
        '<div class="smod">'+m+'</div>'+
        '<div class="scards'+(n>0?' has':'')+'" title="Cartas neutrales desbloqueadas">🃏 '+(n!=null?n:'—')+'</div>'+
      '</div>';
    }).join('');

    var profs = PROF_KEYS.map(function(key){
      var p = PROFESSIONS[key];
      var on = state.profession === key;
      return '<button class="prof'+(on?' selected':'')+'" data-prof="'+key+'">'+
        '<div class="picon">'+p.icon+'</div>'+
        '<div class="pname">'+p.name+'</div>'+
        '<div class="pstat">'+STATS[p.stat].icon+' '+STATS[p.stat].name+'</div>'+
        '<div class="ptag">'+p.tagline+'</div>'+
        '<div class="pcount">🃏 '+p.cards.filter(function(c){return c.reqLevel===1;}).length+' cartas iniciales</div>'+
      '</button>';
    }).join('');

    $('creation').innerHTML =
      '<div class="creation-grid">'+rows+'</div>'+
      '<div class="creation-actions">'+
        '<button class="btn" id="rollbtn">🎲 '+(state.rolled?'Volver a tirar':'Tirar los dados')+'</button>'+
      '</div>'+
      '<div class="crea-sec">Elige tu profesión</div>'+
      '<div class="crea-note">Cada profesión tiene sus propias cartas, que desbloqueas al subir de nivel.</div>'+
      '<div class="profgrid">'+profs+'</div>'+
      '<div class="creation-actions">'+
        '<button class="btn" id="beginbtn"'+((state.rolled&&state.profession)?'':' disabled')+'>⚔️ Entrar a Umbría</button>'+
        '<span class="creation-sum" id="creasum"></span>'+
      '</div>';

    $('rollbtn').onclick = doRoll;
    $('creation').querySelectorAll('.prof').forEach(function(b){
      b.onclick = function(){ state.profession = b.getAttribute('data-prof'); render(); };
    });
    $('beginbtn').onclick = function(){
      if(!state.rolled || !state.profession) return;
      initDeck();
      state.scene='porton'; state.progress=0; state.result=null; state.options=[]; state.level=1; state.xp=0;
      render();
    };
    updateCreaSum();
  }
  function updateCreaSum(){
    var el = $('creasum'); if(!el) return;
    if(!state.rolled){ el.textContent='Tira los dados para empezar.'; return; }
    if(!state.profession){ el.textContent='Ahora elige una profesión.'; return; }
    var p = prof();
    var starters = p.cards.filter(function(c){return c.reqLevel===1;}).length;
    var neutral = NEUTRAL.filter(function(c){ return state.scores[c.stat] >= c.req; }).length;
    el.textContent = 'Mazo inicial: '+starters+' de '+p.name+' + '+neutral+' neutrales = '+(starters+neutral)+' cartas';
  }

  /* =======================================================
     EXPERIENCIA / NIVEL
  ======================================================= */
  function applyXp(n){
    state.xp += n;
    var info={leveled:false, names:[]};
    var nl = levelFor(state.xp);
    while(state.level < nl){
      state.level++;
      info.leveled = true;
      var p = prof();
      if(p){
        p.cards.forEach(function(c){
          if(c.reqLevel === state.level && !cardInPlay(c.id)){ state.deck.push(Object.assign({}, c)); info.names.push(c.icon+' '+c.name); }
        });
      }
    }
    return info;
  }

  /* =======================================================
     JUGAR
  ======================================================= */
  async function playCard(cardUid, mode){
    if(!canPlay()) return;
    var card = state.hand.find(function(c){ return c.uid===cardUid; });
    if(!card) return;
    var spending = (mode === 'roll');
    if(spending && state.dice<=0) return;

    state.busy=true;
    state.selected = null;
    if(spending) state.dice -= 1;
    state.hand = state.hand.filter(function(c){ return c.uid!==cardUid; });
    state.discard.push(card);
    Sfx.click();
    var roll = computeRoll(card, mode);
    renderHudDice(); renderHand();
    Sfx.roll();
    await animateDie(roll);
    applyOutcome(roll, card);
    state.busy=false;
    render();
  }

  function applyOutcome(roll, card){
    var s = currentScene();
    if(roll.success){
      if(card && card.effect) applyReward(card.effect);
      state.progress++;
      if(roll.crit && !s.goal) Sfx.crit();

      var partial = s.goal && state.progress < s.goal;
      if(partial){
        Sfx.hit();
        applyReward(s.partialReward || {xp:1});
        state.result={kind:'ok', roll:roll, text:s.partial};
        state.options=[{label:'⚔️  Seguir luchando', action:'retry'}];
      } else {
        if(s.success && s.success.reward) applyReward(s.success.reward);
        if(!roll.crit) Sfx.success();
        state.result={kind:'ok', roll:roll, text:s.success.text};
        state.options=[{label:'Continuar  →', action:'go', next:s.success.next}];
      }
      return;
    }

    // fallo
    state.hp -= (s.failDmg || 1);
    if(s.failure && s.failure.penalty) applyReward(s.failure.penalty);
    if(roll.fumble) Sfx.fumble(); else Sfx.fail();
    Sfx.hit();

    if(state.hp <= 0){
      state.hp = 0;
      state.result={kind:'bad', roll:roll, text:s.failure.text};
      state.scene='derrota';
      state.options=[{label:'🔁  Volver a empezar', action:'restart'}];
      return;
    }
    state.result={kind:'bad', roll:roll, text:s.failure.text};
    if(s.goal){
      state.options=[
        {label:'⚔️  Seguir luchando', action:'retry'},
        {label:'🏃  Huir', action:'go', next:(s.flee||s.failure.next)}
      ];
    } else {
      state.options=[{label:'Continuar  →', action:'go', next:s.failure.next}];
    }
  }

  function yieldScene(){
    var s = currentScene();
    if(s.type || state.result || state.busy) return;
    state.hp -= (s.failDmg || 1);
    if(s.failure && s.failure.penalty) applyReward(s.failure.penalty);
    Sfx.hit();
    var lead = s.goal ? 'Huyes del combate como puedes. ' : 'Cedes ante el reto y avanzas como puedes. ';
    if(state.hp <= 0){
      state.hp=0;
      state.result={kind:'bad', roll:null, text:lead+s.failure.text};
      state.scene='derrota';
      state.options=[{label:'🔁  Volver a empezar', action:'restart'}];
      render(); return;
    }
    state.result={kind:'bad', roll:null, text:lead+s.failure.text};
    state.options=[{label:'Continuar  →', action:'go', next:(s.goal ? (s.flee||s.failure.next) : s.failure.next)}];
    render();
  }

  function applyReward(reward){
    if(!reward) return;
    var msgs=[];
    if(reward.heal){
      var before=state.hp; state.hp=Math.min(state.maxHp,state.hp+reward.heal);
      if(state.hp-before>0) msgs.push('+'+(state.hp-before)+' ❤️');
    }
    if(reward.gold){ state.gold+=reward.gold; msgs.push('+'+reward.gold+' 🪙'); Sfx.coin(); }
    if(reward.dice){ state.dice+=reward.dice; msgs.push('+'+reward.dice+' 🎲'); }
    if(reward.stat){ for(var k in reward.stat){ state.scores[k]+=reward.stat[k]; msgs.push('+'+reward.stat[k]+' '+STATS[k].icon+' '+STATS[k].name); } }
    if(reward.flag){ state.flags[reward.flag]=true; }

    if(reward.xp){
      msgs.push('+'+reward.xp+' ⭐');
      var info = applyXp(reward.xp);
      if(info.leveled){
        Sfx.level();
        msgs.push('¡Nivel '+state.level+'!');
        state.hp = Math.min(state.maxHp, state.hp+2); msgs.push('+2 ❤️');
        info.names.forEach(function(n){ msgs.push('🔓 '+n); });
      }
    }
    // cartas neutrales desbloqueadas por una nueva puntuación alta
    var fresh=[];
    allCards().forEach(function(base){
      if(base.req == null) return;
      if(isUnlocked(base) && !cardInPlay(base.id)){ state.deck.push(Object.assign({},base)); fresh.push(base.icon+' '+base.name); }
    });
    if(fresh.length){ Sfx.unlock(); fresh.forEach(function(n){ msgs.push('🔓 '+n); }); }

    if(msgs.length) toast(msgs.join('   ·   '));
  }

  function chooseOption(opt){
    if(opt.action==='restart'){ newGame(); return; }
    if(opt.action==='retry'){ state.result=null; state.options=[]; state.selected=null; render(); return; }
    if(opt.action==='go'){ state.scene=opt.next; state.progress=0; state.result=null; state.options=[]; state.selected=null; render(); }
  }
  function choosePath(c){
    if(c.reward) applyReward(c.reward);
    state.scene=c.next; state.progress=0; state.result=null; state.options=[]; state.selected=null; render();
  }
  function buyItem(item){
    if(state.gold < item.cost){ toast('🪙 No tienes suficiente oro.'); return; }
    state.gold -= item.cost;
    applyReward(item.reward);
    state.result=null; state.options=[]; state.selected=null;
    render();
  }

  /* =======================================================
     GRIMORIO
  ======================================================= */
  function grimoireCard(c){
    var avail = state.rolled && isUnlocked(c);
    var need = (c.reqLevel != null) ? ('Nivel '+c.reqLevel) : (STATS[c.stat].icon+' '+c.req);
    return '<div class="gcard'+(avail?'':' locked')+(c.reqLevel>=4?' master':'')+'">'+
      '<div class="gicon">'+(avail?c.icon:'🔒')+'</div>'+
      '<div class="gname">'+c.name+'</div>'+
      '<div class="gtier">'+(c.reqLevel!=null?('Profesión · Nv '+c.reqLevel):'Neutral')+'</div>'+
      '<div class="gmeta">'+STATS[c.stat].icon+' '+STATS[c.stat].name+' &nbsp;+'+c.bonus+(c.effect?' ✦':'')+'</div>'+
      '<div class="gdesc">'+c.desc+'</div>'+
      '<div class="greq'+(avail?' ok':'')+'">'+(avail?'✓ Disponible':'Requiere '+need)+'</div>'+
    '</div>';
  }
  function openGrimoire(){
    var body=$('grim-body'), html='';
    if(state.profession){
      var p=prof();
      html += '<div class="grim-sec">'+p.icon+' '+p.name+' (tu profesión)</div>';
      html += '<div class="grim-grid">'+p.cards.map(grimoireCard).join('')+'</div>';
    } else {
      html += '<div class="grim-sec">Profesión</div><div class="modal-sub">Elige tu profesión al crear el personaje para ver sus cartas.</div>';
    }
    html += '<div class="grim-sec">🃏 Cartas neutrales (por característica)</div>';
    html += '<div class="grim-grid">'+NEUTRAL.map(grimoireCard).join('')+'</div>';
    body.innerHTML = html;

    var total, avail;
    if(state.profession){ total = prof().cards.length + NEUTRAL.length; }
    else total = NEUTRAL.length;
    avail = allCards().filter(function(c){ return state.rolled && isUnlocked(c); }).length;
    $('modal-sub').textContent = 'Disponibles '+avail+' de '+total+' cartas. Las de profesión se desbloquean con niveles; las neutrales, con puntuación alta.';
    $('modal').hidden = false;
  }
  function closeGrimoire(){ $('modal').hidden = true; }

  /* =======================================================
     RENDER
  ======================================================= */
  function render(){
    if(!state.busy) refillHand();
    updateHud();
    renderScene();
    renderHand();
    if(!state.busy) save();

    if(state.scene !== lastScene){
      lastScene = state.scene;
      if(state.scene === 'victoria') Sfx.victory();
      else if(state.scene === 'derrota') Sfx.defeat();
    }
  }

  function renderHudDice(){
    $('dice').textContent = state.dice;
    $('dicebox').classList.toggle('low', state.dice <= 3);
  }
  function updateHud(){
    $('hp').textContent = Math.max(0, state.hp);
    $('hpmax').textContent = state.maxHp;
    $('hpfill').style.width = Math.max(0, (state.hp/state.maxHp)*100)+'%';
    $('gold').textContent = state.gold;
    $('lvl').textContent = state.level;

    var prev = LEVEL_XP[state.level];
    var next = LEVEL_XP[state.level+1];
    var pct = 100, lvlTitle;
    if(next != null){ pct = Math.max(0, Math.min(100, ((state.xp - prev)/(next - prev))*100)); lvlTitle = state.xp+' / '+next+' XP para Nv '+(state.level+1); }
    else { lvlTitle = state.xp+' XP (nivel máximo)'; }
    $('xpfill').style.width = pct+'%';
    $('lvl').parentElement.title = lvlTitle;

    var pc=$('profchip');
    if(state.profession){ pc.hidden=false; pc.innerHTML = prof().icon+' '+prof().name; }
    else pc.hidden = true;

    renderHudDice();
    $('stat-chips').innerHTML = STAT_KEYS.map(function(k){
      if(!state.rolled) return '<span class="chip">'+STATS[k].icon+' '+STATS[k].name+' <b>—</b></span>';
      return '<span class="chip" title="Puntuación '+state.scores[k]+' — desbloquea cartas neutrales">'+STATS[k].icon+' '+STATS[k].name+
             ' <small>'+state.scores[k]+'</small> <b>'+fmtMod(mod(state.scores[k]))+'</b></span>';
    }).join('');
  }

  function renderScene(){
    var s=currentScene(), panel=$('panel');
    $('art').textContent = s.art || '🏰';
    $('title').textContent = s.name;
    $('text').textContent = s.text;
    $('hint').innerHTML=''; $('enemybar').innerHTML=''; $('result').innerHTML=''; $('options').innerHTML=''; $('creation').innerHTML='';

    if(s.type === 'roll'){
      renderCreation();
    } else {
      var best = sceneBest(s);
      if(!s.type && best){
        $('hint').innerHTML = '<div class="hint">🎯 Reto de '+STATS[best].icon+' <b>'+STATS[best].name+
          '</b> — dificultad '+s.dc+'. La carta que coincida recibe <b>+2</b>. Pulsa <b>🎲</b> para tirar d20 (gasta 1 dado) o <b>✋</b> para ir a pulso con un d6 (gratis).</div>';
      }
      if(s.goal){
        var remaining = Math.max(0, s.goal - state.progress);
        $('enemybar').innerHTML = '<div class="foebar">'+
          '<div class="foename">'+(s.boss||s.name)+'</div>'+
          '<div class="foehp"><i style="width:'+((remaining/s.goal)*100)+'%"></i></div>'+
          '<div class="foehptext">Vida '+remaining+' / '+s.goal+'</div>'+
        '</div>';
      }
      renderResult();

      var optBox=$('options');
      if(s.type === 'shop'){
        var items = s.items.concat([{label:'🚪  Salir del mercadillo', desc:'Seguir hacia la torre.', exit:true}]);
        items.forEach(function(it){
          var b=document.createElement('button'); b.className='opt shop';
          var afford = !it.exit && state.gold >= it.cost;
          if(!it.exit && !afford) b.disabled = true;
          b.innerHTML='<div class="olabel">'+it.label+(it.cost!=null?'<span class="ocost">'+it.cost+' 🪙</span>':'')+'</div>'+
            '<div class="odesc">'+it.desc+'</div>';
          b.onclick=function(){ if(it.exit){ state.scene=s.next; state.progress=0; state.result=null; state.options=[]; render(); } else buyItem(it); };
          optBox.appendChild(b);
        });
      } else if(state.options.length || (s.options && !state.progress)){
        (state.options.length ? state.options : s.options).forEach(function(o){
          var b=document.createElement('button'); b.className='opt';
          b.innerHTML='<div class="olabel">'+o.label+'</div>'+(o.desc?'<div class="odesc">'+o.desc+'</div>':'');
          b.onclick=function(){ chooseOption(o); };
          optBox.appendChild(b);
        });
      } else if(s.type === 'choice'){
        s.choices.forEach(function(c){
          var b=document.createElement('button'); b.className='opt';
          b.innerHTML='<div class="olabel">'+c.label+'</div><div class="odesc">'+(c.desc||'')+'</div>';
          b.onclick=function(){ choosePath(c); };
          optBox.appendChild(b);
        });
      } else if(!s.type && !state.result && !state.busy){
        var noDice = state.dice <= 0;
        var ylabel = noDice ? (s.goal?'🌑  Sin dados — huir del combate':'🌑  Sin dados — avanzar a la fuerza')
                            : (s.goal?'🏃  Huir del combate':'😰  Rendirme y avanzar');
        var ydesc = noDice ? (s.goal?'No te queda suerte. Escaparás herido.':'No te queda suerte que tirar. Sufrirás las consecuencias.')
                           : (s.goal?'Escapas sin gastar dado, pero herido.':'No gastas dado, pero cargas con la consecuencia del reto.');
        var b=document.createElement('button'); b.className='opt danger';
        b.innerHTML='<div class="olabel">'+ylabel+'</div><div class="odesc">'+ydesc+'</div>';
        b.onclick=yieldScene; optBox.appendChild(b);
      }
    }
    panel.classList.remove('fade-in'); void panel.offsetWidth; panel.classList.add('fade-in');
  }

  function renderResult(){
    var box=$('result');
    if(state.busy) return;
    if(!state.result){ box.innerHTML=''; return; }
    var r=state.result, html='';
    if(r.roll){
      var roll=r.roll;
      var verdict = roll.crit?'¡CRÍTICO! 🎉':roll.fumble?'¡PIFIA! 💀':(roll.success?'¡ÉXITO!':'FALLO');
      var vclass = roll.success?'ok':'bad';
      var tag = roll.spending ? '' : ' <span class="nodice">· a pulso (d6)</span>';
      var parts = ['<b>'+roll.die+'</b>'+tag];
      parts.push('<span class="plus">+</span> '+STATS[roll.stat].icon+' '+fmtMod(roll.statBonus),
                 '<span class="plus">+</span> 🃏 '+roll.cardBonus);
      if(roll.matched) parts.push('<span class="plus">+</span> 🎯 2');
      var dieHtml = '<div class="die settle'+(roll.spending?'':' low')+'">'+roll.die+'</div>';
      html += '<div class="dice-box">'+dieHtml+'<div>'+
        '<div class="math">'+parts.join(' ')+' = <b>'+roll.total+'</b> <span class="plus">vs</span> dificultad <b>'+roll.dc+'</b></div>'+
        '<div class="verdict '+vclass+'">'+verdict+'</div></div></div>';
    }
    html += '<div class="rtext '+r.kind+'">'+escapeHtml(r.text)+'</div>';
    box.innerHTML = html;
  }

  function renderHand(){
    var s=currentScene(), hand=$('hand'), info=$('deckinfo');
    if(s.type==='choice'||s.type==='end'||s.type==='start'||s.type==='roll'||s.type==='shop'){
      hand.className='hand empty';
      hand.innerHTML = s.type==='choice' ? '🃏 Elige un camino para continuar…'
        : s.type==='shop' ? '🪙 Gasta tu oro en el mercadillo.'
        : s.type==='roll' ? '🎲 Tus características y tu profesión forjarán tus cartas.'
        : s.type==='start' ? '🃏 Tus cartas de acción aparecerán aquí.'
        : '🃏 Fin de la aventura.';
      info.innerHTML=''; updateRollButton(); return;
    }
    hand.className='hand';
    var playable=canPlay();
    var best=sceneBest(s);
    hand.innerHTML='';
    state.hand.forEach(function(card){
      var matched = card.stat === best;
      var sel = state.selected === card.uid;
      var b=document.createElement('button');
      b.className='card'+(card.bonus>=4?' master':'')+(matched?' matched':'')+(sel?' selected':'')+(playable?'':' disabled');
      b.disabled=!playable;
      b.innerHTML='<span class="cbonus">+'+card.bonus+'</span><div class="cicon">'+card.icon+'</div>'+
        '<div class="cname">'+card.name+'</div><div class="cdesc">'+card.desc+'</div>'+
        '<div class="cfoot"><span class="ctag">'+STATS[card.stat].icon+' '+STATS[card.stat].name+' '+fmtMod(mod(state.scores[card.stat]||0))+'</span>'+
        (matched?'<span class="ctag" style="color:var(--ok);border-color:var(--ok)">✓ ideal</span>':'')+'</div>';
      b.onclick=function(){
        if(!canPlay()) return;
        state.selected = (state.selected===card.uid) ? null : card.uid;
        Sfx.click();
        renderHand();
      };
      hand.appendChild(b);
    });
    var line='Mazo: '+state.deck.length+'   ·   Descarte: '+state.discard.length+'   ·   Mano: '+state.hand.length;
    if(state.dice<=0) line+='   ·   <span style="color:var(--bad)">Sin dados (usa ✋)</span>';
    var locked=CARD_POOL_LOCKED();
    if(locked.length){
      line+='<br><span class="locked">🔒 Por desbloquear: '+locked.map(function(c){
        return c.name+' ('+(c.reqLevel!=null?('Nv '+c.reqLevel):(STATS[c.stat].icon+' '+c.req))+')';
      }).join(' · ')+'</span>';
    }
    info.innerHTML=line;
    updateRollButton();
  }
  function updateRollButton(){
    var row=$('roll-row'), btn=$('rolldie'), btn2=$('rollnodie');
    if(!row||!btn) return;
    var s=currentScene();
    if(s.type || state.busy || state.result){ row.hidden=true; return; }
    row.hidden=false;
    var sel = state.selected ? state.hand.find(function(c){ return c.uid===state.selected; }) : null;
    var faces = s.bossDie || 20;
    var isBoss = !!s.bossDie;
    if(btn2) btn2.hidden = isBoss;   // a la Sombra solo la hiere su dado (d3): contra el jefe no hay "a pulso"
    if(!sel){
      btn.disabled=true; btn.textContent='🎲 Tirar el dado';
      if(btn2 && !isBoss){ btn2.disabled=true; btn2.textContent='✋ Sin dado (d6)'; }
      return;
    }
    if(state.dice>0){ btn.disabled=false; btn.textContent='🎲 Tirar d'+faces+' (gasta 1)'; }
    else { btn.disabled=true; btn.textContent='🌑 Sin dados'; }
    if(btn2 && !isBoss){
      var base = mod(state.scores[sel.stat]||0) + sel.bonus + (sel.stat===sceneBest(s)?2:0);
      btn2.disabled=false;
      btn2.textContent='✋ Sin dado (d6+'+base+')';
    }
  }
  function CARD_POOL_LOCKED(){
    return allCards().filter(function(c){ return !(isUnlocked(c) || cardInPlay(c.id)); });
  }

  var toastTimer=null;
  function toast(msg){
    var t=document.querySelector('.toast');
    if(!t){ t=document.createElement('div'); t.className='toast'; document.body.appendChild(t); }
    t.textContent=msg;
    t.style.opacity='1';
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){ t.style.opacity='0'; t.style.transition='opacity .4s'; }, 2800);
  }
  function escapeHtml(str){ return String(str).replace(/[&<>"']/g,function(m){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]; }); }

  /* =======================================================
     INIT
  ======================================================= */
  var musicBtn=$('music'), sfxBtn=$('sfx');
  function refreshAudio(){
    musicBtn.textContent = Music.isOn() ? '🔊 Música' : '🔇 Música';
    sfxBtn.textContent = Sfx.isEnabled() ? '🔔 Sonido' : '🔕 Sonido';
  }
  musicBtn.onclick = function(){ Music.toggle(); refreshAudio(); };
  sfxBtn.onclick = function(){ Sfx.setEnabled(!Sfx.isEnabled()); refreshAudio(); };

  document.addEventListener('pointerdown', function(e){
    AudioEngine.init();
    if(e.target && e.target.closest && e.target.closest('#music')) return;
    if(!Music.isStarted()){ Music.start(); refreshAudio(); }
  });

  $('grimoire').onclick = openGrimoire;
  $('rolldie').onclick = function(){ if(state.selected && canPlay() && state.dice>0) playCard(state.selected, 'roll'); };
  $('rollnodie').onclick = function(){ if(state.selected && canPlay()) playCard(state.selected, 'nodie'); };
  $('modal-close').onclick = closeGrimoire;
  $('modal').addEventListener('click', function(e){ if(e.target === $('modal')) closeGrimoire(); });

  var resetArmed = 0;
  $('reset').onclick = function(){
    var now = Date.now();
    if(now - resetArmed < 3500){ resetArmed = 0; newGame(); }
    else { resetArmed = now; toast('⚠️ Si de verdad quieres empezar de cero, pulsa otra vez.'); }
  };

  var saved = loadSave();
  if(saved){
    state = Object.assign(freshState(), saved);
    state.busy = false;
    if(!state.options) state.options = [];
    lastScene = state.scene;
    render();
    toast('💾 Partida restaurada');
  } else {
    newGame();
  }
})();
</script>
</body>
</html>
